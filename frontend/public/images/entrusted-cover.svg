<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">Entrusted book cover</title>
  <desc id="desc">Minimal deep navy book cover with muted gold rule and serif title.</desc>
  <rect width="720" height="1080" fill="#0B1C32"/>
  <rect x="56" y="56" width="608" height="968" fill="none" stroke="#C9A45C" stroke-width="3"/>
  <rect x="92" y="92" width="536" height="896" fill="none" stroke="#C0B6A4" stroke-width="1" opacity=".45"/>
  <text x="360" y="438" fill="#FFFFFF" font-family="Georgia, serif" font-size="86" text-anchor="middle">Entrusted</text>
  <line x1="214" y1="492" x2="506" y2="492" stroke="#C9A45C" stroke-width="4"/>
  <text x="360" y="558" fill="#F4EFE7" font-family="Inter, Arial, sans-serif" font-size="25" text-anchor="middle">Leadership, stewardship,</text>
  <text x="360" y="596" fill="#F4EFE7" font-family="Inter, Arial, sans-serif" font-size="25" text-anchor="middle">and the work of responsibility</text>
  <text x="360" y="910" fill="#C0B6A4" font-family="Inter, Arial, sans-serif" font-size="22" text-anchor="middle">Femi Owoyele</text>
</svg>
