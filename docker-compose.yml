services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: femiowoyele
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: femiowoyele
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
